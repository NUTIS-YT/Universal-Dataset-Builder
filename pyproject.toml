[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "universal-dataset-builder"
version = "0.1.0"
description = "A cross-platform desktop application for preparing image datasets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "Pillow>=10.0",
    "PySide6>=6.8",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
udb = "universal_dataset_builder.main:main"
udb-api = "universal_dataset_builder.api.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/universal_dataset_builder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
